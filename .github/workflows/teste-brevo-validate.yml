# Temporary TESTE-only validation for EMAIL-001 sandbox send.
# Do not merge. Does not rsync, rebuild, or touch HML/PROD.
name: TESTE Brevo sandbox validate

on:
  push:
    branches:
      - cursor/teste-brevo-sent-8095

permissions:
  contents: read

concurrency:
  group: shopflow-teste-brevo-validate
  cancel-in-progress: false

jobs:
  validate-sandbox:
    name: Worker env + new order + outbox Sent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REMOTE_DEPLOY_DIR: /opt/shopflow/app/deploy
    steps:
      - name: Setup SSH
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Worker status, env, start log follow
        id: worker
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "${VPS_USER}@${VPS_HOST}" \
            "REMOTE_DEPLOY_DIR='${REMOTE_DEPLOY_DIR}' bash -s" <<'EOF'
          set -euo pipefail
          cd "$REMOTE_DEPLOY_DIR"

          echo "=== docker compose ps worker-test ==="
          docker compose ps worker-test

          echo "=== docker compose logs --tail=100 worker-test (redacted) ==="
          docker compose logs --tail=100 worker-test 2>&1 \
            | grep -Eiv 'apikey|token=|password|secret|guestaccess|htmlbody' \
            | tail -n 100

          echo "=== forbidden phrases in last 100 log lines ==="
          if docker compose logs --tail=100 worker-test 2>&1 \
            | grep -Ei 'missing ApiKey|Brevo disabled|missing SenderEmail'; then
            echo "FORBIDDEN_PHRASE=present — worker-test still logging config-missing skips. Recreate after setting Brevo__ApiKey."
            exit 1
          fi
          echo "FORBIDDEN_PHRASE=absent"

          echo "=== container env (no secrets) ==="
          docker compose exec -T worker-test sh -c '
          echo "Enabled=$Brevo__Enabled"
          echo "Sandbox=$Brevo__SandboxMode"
          echo "Sender=$Brevo__SenderEmail"
          if [ -n "$Brevo__ApiKey" ]; then echo "ApiKey=SET"; else echo "ApiKey=MISSING"; fi
          '

          APIKEY_STATE="$(docker compose exec -T worker-test sh -c 'if [ -n "$Brevo__ApiKey" ]; then echo SET; else echo MISSING; fi')"
          echo "APIKEY_STATE=$APIKEY_STATE"
          if [ "$APIKEY_STATE" != "SET" ]; then
            echo "Brevo__ApiKey is not present in worker-test."
            exit 1
          fi
          EOF

      - name: Query proof order 10021 only (no new order)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          ORDER_ID: be5db9a7-933c-4885-b82c-e7dd319399ec
          ORDER_NUMBER: "10021"
        run: |
          set -euo pipefail
          echo "Querying order ${ORDER_NUMBER} (${ORDER_ID}) without creating another order"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "${VPS_USER}@${VPS_HOST}" \
            "REMOTE_DEPLOY_DIR='${REMOTE_DEPLOY_DIR}' ORDER_ID='${ORDER_ID}' ORDER_NUMBER='${ORDER_NUMBER}' bash -s" <<'EOF'
          set -euo pipefail
          cd "$REMOTE_DEPLOY_DIR"
          KEY="order:${ORDER_ID}:created"

          echo "=== proof order outbox ==="
          docker compose exec -T postgres psql -U shopflow -d shopflow_test </dev/null \
            -c "SELECT \"Id\", \"Type\", \"IdempotencyKey\", \"Status\", \"Attempts\", \"ProviderMessageId\", \"LastError\", \"CreatedAt\", \"SentAt\" FROM notifications.email_outbox WHERE \"IdempotencyKey\" = '${KEY}';"

          echo "=== proof order intent ==="
          docker compose exec -T postgres psql -U shopflow -d shopflow_test </dev/null \
            -c "SELECT \"OrderId\", \"Type\", \"IdempotencyKey\", \"Status\", \"CreatedAt\", \"DispatchedAt\" FROM orders.email_intents WHERE \"OrderId\" = '${ORDER_ID}';"

          echo "=== outbox status counts ==="
          docker compose exec -T postgres psql -U shopflow -d shopflow_test </dev/null \
            -c "SELECT \"Status\", count(*) FROM notifications.email_outbox GROUP BY 1 ORDER BY 1;"

          echo "=== recent worker logs (filtered) ==="
          docker compose logs --tail=80 worker-test 2>&1 \
            | grep -Eiv 'apikey|token=|password|secret|guestaccess|htmlbody' \
            | grep -Ei 'email|brevo|outbox|intent|sent|skip|failed|error|provider|401' || true
          EOF
